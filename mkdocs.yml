site_name: Learning Curve
site_description: Technical documentation hosted on GitHub Pages

theme:
  name: material
  palette:
    # Automatic light/dark mode based on user system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes      # Direct link to section index pages
    - navigation.instant      # Instant page loads (SPA-like feel)
    - navigation.tracking     # Update URL anchor on scroll
    - navigation.top
    - search.suggest          # Search autocompletion
    - search.highlight        # Highlight search query matches in body
    - toc.follow
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.arithmatex:
      generic: true

plugins:
   - search
   - awesome-nav

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js